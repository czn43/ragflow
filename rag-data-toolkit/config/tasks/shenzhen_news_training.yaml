# SZTV + 深圳新闻网 双来源练习任务。
# 用于演练“不同域名、不同分页机制，统一采集清洗后合并”的完整流程。
task:
  id: shenzhen_news_training
  name: 深圳新闻双来源练习
  description: SZTV JavaScript翻页 + 深圳新闻网加载更多，多来源统一标准JSON与跨站去重
  fail_fast: false

sites:
  - id: sztv
    name: 深圳广电第一现场
    config: config/sites/sztv.yaml
    enabled: true
    priority: 20
    max_pages: 10
    max_docs: 100
    overrides:
      metadata:
        category: 深圳新闻-广电新闻

  - id: sznews
    name: 深圳新闻网
    config: config/sites/sznews.yaml
    enabled: true
    priority: 20
    max_pages: 10
    max_docs: 100
    overrides:
      metadata:
        category: 深圳新闻-深圳新闻网

merge:
  dedup_url: true
  dedup_content: true
