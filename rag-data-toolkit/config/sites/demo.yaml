# v1.4: 比赛当天优先改 start_urls / site.name / site.domain。
# Selector 可以继续配；即使 Selector 写错或缺失，程序也会自动发现疑似文章链接。
site:
  name: 示例政府网站
  domain: example.gov.cn

crawler:
  # auto: 自动判断列表页/详情页；list/detail 可强制指定。
  start_mode: auto
  start_urls:
    - https://example.gov.cn/news/index.html
  timeout: 15
  retries: 3
  delay:
    min: 0.2
    max: 0.8

# 有准确 DOM 时优先用 Selector；匹配 0 条会自动 fallback。
list:
  item_selector: '.news-list li'
  link_selector: 'a'
  title_selector: 'a'
  date_selector: '.date'

pagination:
  # next_link / url_template / page_parameter / playwright_click / none
  type: next_link
  next_selector: 'a.next'

# 自动链接发现参数。通常不必修改。
discovery:
  min_score: 3
  detail_url_score: 4
  allow_external: false

# 详情页优先按规则提取，失败后自动 fallback 到 Trafilatura。
detail:
  min_content_chars: 100
  title:
    selectors:
      - 'h1'
      - '.article-title'
      - '.title'
  content:
    selectors:
      - '.TRS_Editor'
      - '.article-content'
      - '.article-detail'
      - '#content'
  publish_time:
    selectors:
      - '.publish-time'
      - '.date'
      - '.time'
  source:
    selectors:
      - '.source'
      - '.article-source'

metadata:
  category: 新闻资讯
  region: 深圳
  max_tags: 5

tag_rules:
  人工智能:
    - 人工智能
    - AI
    - 大模型
    - 机器学习
  机器人:
    - 机器人
    - 人形机器人
    - 具身智能
  政策:
    - 政策
    - 规划
    - 办法
    - 意见
  融资:
    - 融资
    - 投资
    - 基金
