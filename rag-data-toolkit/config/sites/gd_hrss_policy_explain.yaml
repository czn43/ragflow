# 广东省人社厅 - 广东就业 / 政策法规 / 政策解读
# document_type=policy_explanation 会触发“解读页→原文页→附件PDF”的关系解析。
site:
  name: 广东省人力资源和社会保障厅-就业政策解读
  domain: hrss.gd.gov.cn
crawler:
  start_mode: list
  start_urls:
    - https://hrss.gd.gov.cn/jyzl/zcfg/zcjd/
  timeout: 20
  retries: 3
  delay: {min: 0.2, max: 0.6}
list:
  item_selector: ul.list li
  link_selector: "a[href*='/content/post_']"
  title_selector: "a[href*='/content/post_']"
  date_selector: .pubDate
pagination:
  type: next_link
  next_selector: .pages a.next
discovery:
  min_score: 6
  detail_url_score: 4
  allow_external: false
  # 空壳尾页没有文章列表时，兜底发现会命中页脚 /wzdh/ 导航，需要排除。
  negative_path_words: ["/wzdh/"]
detail:
  min_content_chars: 100
  render_fallback: true
  title:
    selectors: [.article_t, h1, .article-title, .title]
  content:
    selectors: [.article_con, .article]
  publish_time:
    selectors: [.article_item, .time, .date, .publish-time]
    regex_extract: "(\\d{4}-\\d{1,2}-\\d{1,2})"
  # 信息栏含“分享/字体”等噪声，不强行抽取来源；无法确定时回落为站点名。
  source:
    selectors: []
metadata:
  category: 教育与人才-就业政策-政策解读
  region: 广东
  document_type: policy_explanation
  max_tags: 7
tag_rules:
  政策解读: [政策解读, 图解, 问答]
  高校毕业生: [高校毕业生, 毕业生]
  就业服务: [公共就业服务, 就业服务, 招聘]
  补贴: [补贴, 社保补贴, 求职补贴]
