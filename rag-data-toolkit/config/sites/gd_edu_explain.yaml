# 广东省教育厅 - 政策解读
site:
  name: 广东省教育厅-政策解读
  domain: edu.gd.gov.cn
crawler:
  start_mode: list
  start_urls:
    - https://edu.gd.gov.cn/zwgknew/zcjd/
  timeout: 20
  retries: 3
  delay: {min: 0.2, max: 0.6}
list:
  item_selector: ""
  link_selector: "a"
  title_selector: ""
  date_selector: ""
pagination:
  type: url_template
  template: "https://edu.gd.gov.cn/zwgknew/zcjd/index_{page}.html"
discovery:
  min_score: 3
  detail_url_score: 4
  allow_external: false
detail:
  min_content_chars: 80
  policy_relation: true
  attachment_extract: true
  render_fallback: true
  title:
    selectors: ["h1", ".article-title", ".title"]
  content:
    selectors: [".TRS_Editor", ".article-content", ".zwxl-con", "#content"]
  publish_time:
    selectors: [".time", ".date", ".publish-time", ".article-info"]
    regex_extract: "(?:时间|发布日期|发布时间)[：:]?\\s*(\\d{4}[-/.年]\\d{1,2}[-/.月]\\d{1,2})"
  source:
    selectors: [".source", ".article-source", ".article-info"]
    regex_extract: "(?:资料来源|来源)[：:]?\\s*([^\\s]+)"
metadata:
  category: 教育与人才-政策解读
  region: 广东
  document_type: policy_explanation
  max_tags: 6
